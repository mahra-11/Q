# Configuration for Chignolin (CLN025) trajectory analysis
# All paths reference the NYU HPC filesystem.

system: chignolin

# --- Trajectory data (on HPC cluster, not in this repo) ---
# Full 500 k-frame trajectory (GROMACS XTC format)
trajectory_xtc:
  - /scratch/ccbg/B_DNA-Folding/Chignolin_Miles/Chignolin_Traj/f_traj/CLN025-0-protein-all_fiti_alpC.xtc

# Alternate concatenated file (all frames, used in some notebooks)
trajectory_xtc_all:
  - /scratch/ccbg/B_DNA-Folding/Chignolin_Miles/Chignolin_Traj/f_traj/all_frames_chignoling.xtc

# Reference PDB topology (folded structure, used for PyEMMA featurization)
topology_pdb: /scratch/ccbg/B_DNA-Folding/Chignolin_Miles/Chignolin_Traj/f_traj/folded_struc.pdb

# Local aligned structure (for visualization, e.g. VMD / PyMOL)
aligned_pdb: structures/chignolin/Chignolin_Aligned.pdb

# --- Clustering ---
# Cluster CSV with columns: Time_ps, Cluster_ID
# Produced by notebooks/01_clustering.ipynb
# cluster_csv: data/chignolin/cluster_40.csv

# Cluster probability CSV with columns: Time_ps, Cluster_ID, Committor_prob
# Produced by notebooks/02_committor_counting.ipynb
# cluster_prob_csv: data/chignolin/cluster_40_prob.csv

# --- Committor state definitions ---
# Best-validated assignment (cluster 1 = most-folded, cluster 7 = most-unfolded)
folded_clusters:   [1]
unfolded_clusters: [7]

# --- Feature extraction ---
stride: 10   # Load every 10th frame (≈ 50 k frames from 500 k)

# --- Native contacts (Q) ---
# Reference structure for native-contact definition (defaults to topology_pdb)
# native_pdb: null
q_folded_threshold: 0.8
q_unfolded_threshold: 0.2

# Where to write Q_values.csv. Defaults to data/<system>/ if unset.
# Kept alongside the existing MDTraj feature table for this system so all
# MDTraj-derived per-frame outputs live in one place.
q_output_dir: /scratch/mma9420/committor_check/Q

# --- Physics-informed committor network (PINN) ---
# Trains q_theta(x) directly against the committor's martingale property
# (q(x_t) = E[q(x_t+lag)]) instead of fitting a regressor to noisy binned
# committor labels -- see README "Physics-informed committor learning".
pinn:
  # Lag (in frames) between (x_t, x_t+lag) pairs for the martingale loss.
  # Frames are 200 ps apart (see Q_values_allframes.csv), so lag=1 is the
  # shortest possible step. Worth sweeping: too short and single-step noise
  # can dominate the signal; too long and consecutive frames stop being
  # meaningfully correlated, which weakens the martingale constraint.
  lag: 1
  hidden_dims: [128, 128, 64]
  epochs: 200
  batch_size: 4096
  lr: 0.001
  boundary_weight: 1.0
  val_frac: 0.1
  seed: 0
  # Boundary-condition thresholds (tighter than q_folded/unfolded_threshold
  # above, which are for the empirical Fate scan, not this loss).
  q_unfolded_boundary: 0.1
  q_folded_boundary: 0.9
  # Inputs/outputs. Default to alongside the rest of the Q pipeline's
  # outputs (q_output_dir above) if left unset:
  # dataset_csv: /scratch/mma9420/committor_check/Q/pinn_dataset.csv
  # output_dir: /scratch/mma9420/committor_check/Q/pinn
  # empirical_curve_csv: /scratch/mma9420/committor_check/Q/committor_1d_visits_sem.csv
